spring.application.name=backend
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.datasource.url=jdbc:postgresql://localhost:5432/mobilneappdb
spring.datasource.username=postgres
spring.datasource.password=testpassword
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
routing.osrm.base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
# Odbrana/demo: 70-second booking uses reminders at 60, 30, 20 and 10 seconds.
# Production profile restores specification values (15, 10 and 5 minutes).
app.ride.reminder-thresholds-seconds=60,30,20,10
app.ride.reminder-check-rate-ms=5000
# Local MailDev SMTP server (MailDev defaults to port 1025).
# MailDev does not require SMTP authentication or TLS.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=no-reply@localhost
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
