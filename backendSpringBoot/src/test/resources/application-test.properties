# Integration-test profile: use the same development services as the application.
spring.datasource.url=jdbc:postgresql://localhost:5432/mobilneappdb_test
spring.datasource.username=postgres
spring.datasource.password=testpassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# The test database is isolated, so create and remove its schema for each test context.
spring.jpa.hibernate.ddl-auto=create-drop

# Prevent @DataJpaTest from replacing PostgreSQL with an embedded database.
spring.test.database.replace=none

# Local MailDev SMTP server (same as development configuration).
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=no-reply@localhost
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
